<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121d2a"><title>Sign in · Mangrove Mews</title>
<link rel="stylesheet" href="/style.css">
<style>
main.access{max-width:440px;margin:9vh auto;padding:12px}.access .screen{display:block;padding:25px 20px}.access h1{font-size:28px;margin:10px 0 18px}
.access label{font:600 16px/1.5 system-ui}.access select,.access input,.access button{width:100%;min-height:46px;font-size:16px}.access form{display:grid;gap:16px}
.access p{color:#bed3d8;line-height:1.5}.access .error{color:#ffac9c}
</style></head><body>
<main class="access"><section class="device"><div class="caseRim"></div><div class="screen">
<span class="eyebrow">MANGROVE MEWS</span><h1>Rescue team sign-in</h1>
<form action="/login" method="post"><label>Team member<input name="user" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64"></label>
<label>Access code<input name="code" type="password" required autocomplete="off" maxlength="12" autocapitalize="characters"></label>
<p>Use the code for your name from the demo laptop.</p><!-- login-error -->
<button class="primary" type="submit">Open tracker →</button></form></div></section></main></body></html>
