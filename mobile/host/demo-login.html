<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162633"><title>Mangrove Mews · Demo sign-in</title><style>/* EMBED_STYLE */
.access{padding:18px 12px;max-width:450px;margin:clamp(12px,6vh,65px) auto 0}.access .panel{padding:24px 18px 22px}.access .eyebrow{color:#9edcce}.access h1{font-size:clamp(25px,6vw,35px);margin:10px 0}.access p{color:#b6c7ce;margin:0 0 20px}.access form{gap:15px}.access label{font-size:14px}.access input,.access select{min-height:46px}.access .note{font:12px monospace;color:#b4cbd1}.access .note code{font-weight:bold;color:#f1c780}.access .error{color:#ff9fa8}.access .team{display:block;text-align:center;margin-top:18px;color:#aadada;font-size:13px}.access svg{width:48px;margin-bottom:14px}.access .primary{min-height:46px}
.access h1{font:700 32px/1.15 system-ui;text-transform:none}.access .eyebrow{font:650 16px/1.4 system-ui;letter-spacing:0}.access label,.access .note,.access .team{font:500 16px/1.5 system-ui}.access select,.access input{font-size:18px}.access .team{padding:10px 0}
</style></head><body><main class="access"><section class="device"><div class="caseRim"></div><div class="screen panel"><svg viewBox="0 0 32 30" shape-rendering="crispEdges" aria-hidden="true"><path fill="#91cbd3" d="M2 2h6v4h4v3h9V6h4V2h5v22h-4v4H7v-3H2z"/><path fill="#f0cf9d" d="M4 6h4v5h15V8h5v15h-4v3H9v-3H4z"/><path fill="#b97c56" d="M4 7h4v5h6v7H4z"/><path fill="#526778" d="M21 11h7v7h-8z"/><path fill="#152230" d="M8 16h4v3H8zm13 0h4v3h-4zm-7 4h5v2h-2v2h-2v-2h-1z"/></svg><div class="eyebrow">Mangrove Mews Cat Rescue</div><h1>Demo sign-in</h1><p>Choose a volunteer to send an update or the founder to review it.</p><form id="demoForm"><label>Demo account<select id="account"><option value="luz">Feeder · Luz</option><option value="nico">Volunteer · Nico</option><option value="beatriz">Founder · Beatriz</option></select></label><label>Demo passcode<input id="pass" type="password" autocomplete="off" required placeholder="Enter the demo passcode"></label><span class="note">Demo passcode for all accounts: <code>MEWS7</code></span><span id="error" class="error" role="alert" hidden></span><button class="primary">Sign in →</button></form><a id="teamLogin" class="team" target="_top" href="https://mangrove-mews-field-station.stellarcatkin1.chatgpt.site/station">Rescue team · Continue with ChatGPT</a></div><div class="rail bottom"><span>⊕</span><span></span><span>⊕</span></div></section></main><script>
const accounts={nico:{display:'Nico',role:'volunteer'},luz:{display:'Luz',role:'volunteer'},beatriz:{display:'Beatriz',role:'founder'}};
function enter(name){try{sessionStorage.setItem('mews.demo.account',name)}catch{}window.MEWS_REHEARSAL=accounts[name];const raw=atob('EMBED_STATION');const html=new TextDecoder().decode(Uint8Array.from(raw,ch=>ch.charCodeAt(0)));document.open();document.write(html);document.close()}
if(location.protocol==='file:')document.querySelector('#teamLogin').hidden=true;
document.getElementById('demoForm').onsubmit=e=>{e.preventDefault();if(document.getElementById('pass').value.trim()!=='MEWS7'){let msg=document.getElementById('error');msg.hidden=false;msg.textContent='Incorrect demo passcode. Use MEWS7.';return}enter(document.getElementById('account').value)};
window.addEventListener('load',()=>{try{const n=sessionStorage.getItem('mews.demo.account');if(Object.hasOwn(accounts,n))enter(n)}catch{}},{once:true});
</script></body></html>
